    <linearGradient id="brass" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#8C6322"/>
      <stop offset="45%" stop-color="#F2D283"/>
      <stop offset="100%" stop-color="#9A6E26"/>
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="12" fill="#6B1624"/>
  <rect x="3" y="3" width="58" height="58" rx="9.5" fill="none" stroke="#D9AE5F" stroke-width="1.5"/>
  <!-- Brass caps & finials -->
