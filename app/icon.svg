  <path d="M20 15 Q32 10 44 15 Z" fill="url(#brass)" stroke="#23181A" stroke-width="1.2"/>
  <path d="M20 49 Q32 54 44 49 Z" fill="url(#brass)" stroke="#23181A" stroke-width="1.2"/>
